name: Build Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub Releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # Run checks before building
      - name: Lint
        run: gradle lintRelease

      - name: Test
        run: gradle test

      - name: Build release APK
        run: gradle assembleRelease

      # Without signing secrets the APK is unsigned.
      # To produce a signed APK, add these repository secrets:
      #   KEYSTORE_BASE64  - base64-encoded .jks/.keystore file
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD
      # Then add a step before assembleRelease that writes keystore.properties:
      #
      #   - name: Decode keystore
      #     env:
      #       KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #     run: |
      #       echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
      #       cat > keystore.properties <<EOF
      #       storeFile=release.keystore
      #       storePassword=${{ secrets.KEYSTORE_PASSWORD }}
      #       keyAlias=${{ secrets.KEY_ALIAS }}
      #       keyPassword=${{ secrets.KEY_PASSWORD }}
      #       EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
