name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The wrapper jar is not committed (*.jar in .gitignore).
      # setup-gradle with gradle-version: wrapper reads the version from
      # gradle/wrapper/gradle-wrapper.properties and installs it on PATH.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Lint
        run: gradle lintRelease

      - name: Test
        run: gradle test
