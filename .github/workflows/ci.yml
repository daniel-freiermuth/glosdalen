name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintRelease

      - name: Test
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

  # Separate job so lint/test/build stay fast. CopilotStorageTest exercises the real
  # Android Keystore and cannot run on the JVM; same task as `make test-android`.
  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The api35 managed device (app/build.gradle.kts) installs its system image into the SDK
      - name: Locate system image
        run: echo "SYSTEM_IMAGE_DIR=$ANDROID_HOME/system-images/android-35/aosp_atd" >> "$GITHUB_ENV"

      - name: Cache system image
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEM_IMAGE_DIR }}
          key: system-image-android-35-aosp_atd-x86_64

      - name: Instrumented tests
        run: ./gradlew api35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ github.sha }}
          path: app/build/reports/androidTests/
